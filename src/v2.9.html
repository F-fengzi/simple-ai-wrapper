<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>simple-ai-wrapper</title>
    <meta name="description" content="a simple ai api (specifically a few cf workers) wrapper using vanilla html/js/css that i initially wrote in like 30 minutes with some ai help">
    <meta name="author" content="fengzi">
    <meta name="version" content="2.9">
    <!-- <link rel="dns-prefetch" href="https://ai-endpoint.fengzi.workers.dev/"> -->
    <style>
        :root {
            --image-count: 5;
        }
        html {
            width: 100%;
            height: var(--full-height, 100dvh);
        }
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            flex-flow: column nowrap;
        }
        select, input[type="text"], textarea {
            padding: 3px 6px;
        }
        /* ------------------------------ */
        #top-page-section {
            flex: 1;
            padding: 1rem;
            overflow-y: scroll;
        }

        #top-controls {
            width: 100%;
            display: flex;
            flex-flow: row nowrap;
            gap: 0.5rem;
        }

        #options-column {
            flex: 1;
            display: flex;
            flex-flow: column nowrap;
        }
        #text-task-column {
            flex: 2;
            display: flex;
            flex-flow: column nowrap;
        }
        #image-task-column {
            flex: 2;
            display: flex;
            flex-flow: row nowrap;
        }

        #mode-selector {
            height: 2rem;
            box-sizing: border-box;
        }
        #model-selector {
            height: 2rem;
            box-sizing: border-box;
        }

        #system-prompt-input {
            width: 100%;
            height: 4rem;
            min-height: 4rem;
            box-sizing: border-box;
            resize: vertical;
        }

        #image-prompt-input {
            width: 100%;
            height: 4rem;
            box-sizing: border-box;
            font-size: 16px;
            resize: none;
        }
        #image-generate-button {
            width: 6rem;
            height: 4rem;
            box-sizing: border-box;
            background-color: #fa9b71;
        }

        #text-hint, #image-hint {
            position: sticky;
            top: 0;
            margin: 0.5rem 0;
        }
        /* ---------- */
        #top-quick-switches-container {
            width: 100%;
            margin-top: 0.5rem;
            display: flex;
            flex-flow: row nowrap;
            gap: 0.25rem;
        }
        .top-quick-switches-row {
            flex: 1;
            display: flex;
            flex-flow: row nowrap;
            gap: 0.5rem;
        }
        .quick-switch-button {
            flex: 1;
            height: 2rem;
            border: 1px solid #888;
        }
        .active {
            background-color: #f1dcc9;
        }
        /* ---------- */
        #results-display {
            width: 100%;
        }
        #text-section {
            display: flex;
            flex-flow: column nowrap;
        }
        #text-results {
            align-self: center;
            width: 100%;
            max-width: 60rem;
            display: flex;
            flex-flow: column nowrap;
            gap: 1rem;
        }
        .text-message {
            margin: 0;
            padding: 0.5rem 1rem;
            max-width: 36rem;
            min-height: 2rem;
            box-sizing: border-box;
            border-radius: 8px;
            font-size: 16px;
            font-family: sans-serif;
            word-break: break-word;
            box-shadow: 0 3px 6px rgba(10, 10, 9, 0.05);
        }
        .text-message p:first-child {
            margin-top: 0;
        }
        .text-message p:last-child {
            margin-bottom: 0;
        }
        .text-message h1 {
            font-size: 1.5em;
        }
        .text-message h2 {
            font-size: 1.25em;
        }
        .text-message h3 {
            font-size: 1.125em;
        }
        .text-message em {
            color: #777;
        }
        .user-message {
            align-self: flex-end;
            background-color: #faeadb;
        }
        .model-message {
            align-self: flex-start;
            background-color: #faf7f3;
        }
        #image-section {
            display: flex;
            flex-flow: column nowrap;
        }
        #image-results {
            width: 100%;
            display: flex;
            flex-flow: row wrap;
            gap: 0.5rem;
        }
        #image-results img {
            width: calc(100% / var(--image-count) - ((var(--image-count) - 1) * 0.5rem / var(--image-count)));
        }
        /* ---------- */
        #bottom-page-section {
            padding: 0.5rem 1rem 1rem 1rem;
        }

        #bottom-message-box {
            width: 100%;
            display: flex;
            flex-flow: row nowrap;
        }
        #text-message-input {
            flex: 1;
            min-height: 3rem;
            box-sizing: border-box;
            font-size: 16px;
            resize: vertical;
        }
        #text-send-button {
            width: 4rem;
            height: 3rem;
            box-sizing: border-box;
            background-color: #fa9b71;
            border: 1px solid #333;
        }
        /* ------------------------------ */
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
            }
            body, select, input, textarea, button {
                background-color: #16130f;
                color: #eee;
            }
            #top-page-section {
                scrollbar-width: thin;
            }
            #image-generate-button {
                background-color: #c75b29;
            }
            .active {
                background-color: #3b2e27;
            }
            .text-message em {
                color: #aaa;
            }
            .user-message {
                background-color: #41332c;
            }
            .model-message {
                background-color: #1d1b19;
            }
            #text-send-button {
                background-color: #c75b29;
                border: 1px solid #ccc;
            }
        }
        @media screen and (max-width: 90rem) {
            :root {
                --image-count: 4;
            }
        }
        @media screen and (max-width: 70rem) {
            :root {
                --image-count: 3;
            }
            #top-quick-switches-container {
                flex-flow: column nowrap;
            }
        }
        @media screen and (max-width: 50rem) {
            :root {
                --image-count: 2;
            }
        }
        @media screen and (max-width: 36rem) {
            #top-controls {
                flex-flow: column nowrap;
            }
        }
    </style>
</head>
<body>
    <noscript>This thing doesn't work at all if you don't allow JavaScript.<br /><br /><br /></noscript>
    <div id="top-page-section">
        <div id="top-controls">
            <div id="options-column">
                <select id="mode-selector">
                    <option value="text">Text Generation</option>
                    <option value="image">Image Generation</option>
                </select>
                <input id="model-selector" type="text" value="@cf/meta/llama-4-scout-17b-16e-instruct" placeholder="Cf-accepted model">
            </div>
            <div id="text-task-column">
                <textarea id="system-prompt-input" placeholder="System prompt">You are a friendly assistant.</textarea>
            </div>
            <div id="image-task-column">
                <textarea id="image-prompt-input" placeholder="Enter your prompt"></textarea>
                <button id="image-generate-button">Generate</button>
            </div>
        </div>
        <div id="top-quick-switches-container">
            <div class="top-quick-switches-row">
                <button class="quick-switch-button" data-model="@cf/meta/llama-4-scout-17b-16e-instruct">Llama 4 17B</button>
                <button class="quick-switch-button" data-model="@cf/meta/llama-3.3-70b-instruct-fp8-fast">Llama 3.3 70B</button>
                <button class="quick-switch-button" data-model="@cf/meta/llama-3.1-8b-instruct">Llama 3.1 8B</button>
            </div>
            <div id="second-top-quick-switches-row" class="top-quick-switches-row">
                <button class="quick-switch-button" data-model="@cf/qwen/qwen3-30b-a3b-fp8">Qwen3 30B</button>
                <button class="quick-switch-button" data-model="@cf/google/gemma-3-12b-it">Gemma 3 12B</button>
                <button class="quick-switch-button" data-model="@cf/mistralai/mistral-small-3.1-24b-instruct">Mistral 3.1 24B</button>
            </div>
        </div>
        <div id="results-display">
            <div id="text-section">
                <p id="text-hint">Text:</p>
                <div id="text-results"></div>
            </div>
            <div id="image-section">
                <p id="image-hint">Images:</p>
                <div id="image-results"></div>
            </div>
        </div>
    </div>
    <div id="bottom-page-section">
        <div id="bottom-message-box">
            <textarea id="text-message-input" placeholder="Type to model (/help for commands)" autofocus></textarea>
            <button id="text-send-button">Send</button>
        </div>
    </div>
    <script src="./marked.umd.js" defer></script>
    <script>
        let mode = "text";
        let textHistory = [];

        const topPageSection = document.getElementById("top-page-section");
        const textResults = document.getElementById("text-results");
        const imageResults = document.getElementById("image-results");
        const textMessageInput = document.getElementById("text-message-input");
        const imagePromptInput = document.getElementById("image-prompt-input");
        const textSendButton = document.getElementById("text-send-button");
        const imageGenerateButton = document.getElementById("image-generate-button");
        const quickSwitchButtons = document.querySelectorAll(".quick-switch-button");

        // dynamically resize document size for quirky mobile browsers
        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", () => {
                document.documentElement.style.setProperty("--full-height", `${window.visualViewport.height}px`);
                window.scrollTo(0, 0);
            });
        } else {
            window.addEventListener("resize", () => {
                document.documentElement.style.setProperty("--full-height", `${window.innerHeight}px`);
                window.scrollTo(0, 0);
            });
        }

        // change default model and switch elements display based on mode
        // must be exclusive to the mode and display be "flex"
        const TEXT_MODE_ELEMENTS = ["text-task-column", "second-top-quick-switches-row", "text-section", "bottom-page-section"];
        const IMAGE_MODE_ELEMENTS = ["image-task-column", "image-section"];
        function switchMode() {
            TEXT_MODE_ELEMENTS.forEach(id => {
                document.getElementById(id).style.display = mode === "text" ? "flex" : "none"; // why tf is hidden unstable??
            });
            IMAGE_MODE_ELEMENTS.forEach(id => {
                document.getElementById(id).style.display = mode === "image" ? "flex" : "none";
            });

            if (mode === "text") {
                document.getElementById("model-selector").value = "@cf/meta/llama-4-scout-17b-16e-instruct";
                quickSwitchButtons[0].innerHTML = "Llama 4 17B";
                quickSwitchButtons[0].setAttribute("data-model", "@cf/meta/llama-4-scout-17b-16e-instruct");
                quickSwitchButtons[1].innerHTML = "Llama 3.3 70B";
                quickSwitchButtons[1].setAttribute("data-model", "@cf/meta/llama-3.3-70b-instruct-fp8-fast");
                quickSwitchButtons[3].innerHTML = "Llama 3.1 8B";
                quickSwitchButtons[3].setAttribute("data-model", "@cf/meta/llama-3.1-8b-instruct");
                quickSwitchButtons[3].innerHTML = "Qwen3 30B";
                quickSwitchButtons[3].setAttribute("data-model", "@cf/qwen/qwen3-30b-a3b-fp8");
                quickSwitchButtons[4].innerHTML = "Gemma 3 12B";
                quickSwitchButtons[4].setAttribute("data-model", "@cf/google/gemma-3-12b-it");
                quickSwitchButtons[5].innerHTML = "Mistral 3.1 24B";
                quickSwitchButtons[5].setAttribute("data-model", "@cf/mistralai/mistral-small-3.1-24b-instruct");
            } else if (mode === "image") {
                document.getElementById("model-selector").value = "@cf/black-forest-labs/flux-1-schnell";
                quickSwitchButtons[0].innerHTML = "FLUX.1 [schnell]";
                quickSwitchButtons[0].setAttribute("data-model", "@cf/black-forest-labs/flux-1-schnell");
                quickSwitchButtons[1].innerHTML = "SDXL";
                quickSwitchButtons[1].setAttribute("data-model", "@cf/stabilityai/stable-diffusion-xl-base-1.0");
                quickSwitchButtons[2].innerHTML = "SDXL Lightning";
                quickSwitchButtons[2].setAttribute("data-model", "@cf/bytedance/stable-diffusion-xl-lightning");
            }
        }
        document.getElementById("mode-selector").addEventListener("change", () => {
            mode = document.getElementById("mode-selector").value;
            switchMode();
            updateActiveQuickSwitchButton();
        });

        // update active button upon manual model change
        function updateActiveQuickSwitchButton() {
            quickSwitchButtons.forEach(button => {
                if (button.getAttribute("data-model") === document.getElementById("model-selector").value) {
                    button.classList.add("active");
                } else {
                    button.classList.remove("active");
                }
            });
        }
        document.getElementById("model-selector").addEventListener("input", updateActiveQuickSwitchButton);

        switchMode();
        updateActiveQuickSwitchButton();

        // quick switch buttons' function
        quickSwitchButtons.forEach(button => {
            button.addEventListener("click", () => {
                document.getElementById("model-selector").value = button.getAttribute("data-model");
                updateActiveQuickSwitchButton();
            });
        });

        // queue display system
        let textQueue = 0;
        let imageQueue = 0;
        function updateHints() {
            document.getElementById("text-hint").innerHTML = textQueue === 0 ? "Text:" : "Text (Waiting... " + textQueue + " in queue):";
            document.getElementById("image-hint").innerHTML = imageQueue === 0 ? "Images:" : "Images (Loading... Current queue: " + imageQueue + ". Please wait for a few seconds):";
        };

        // new text message in dom
        function addLastTextMessage() {
            const newMessage = textHistory[textHistory.length - 1];
            const textElement = document.createElement("p");
            textElement.innerHTML = marked.parse(newMessage.content);
            textElement.classList.add("text-message");
            textElement.classList.add(newMessage.user ? "user-message" : "model-message");
            textResults.appendChild(textElement);
            topPageSection.scrollTo(0, topPageSection.scrollHeight);
            return textElement;
        }

        // commands
        function handleCommands(rawInput) {
            // Testie!! Is this you??? (the ogs will get this reference)
            const processedOptions = rawInput.trim().substring(1).split(" ");
            switch (processedOptions[0].toLowerCase()) {
                case "regenerate":
                case "g":
                    if (textHistory.length > 0 && textHistory[textHistory.length - 1].user === false) {
                        textHistory.splice(-1);
                        textResults.removeChild(textResults.lastElementChild);
                    }
                    getModelResponse();
                    return true;
                case "continue":
                case "t":
                    if (textHistory.length == 0) {
                        getModelResponse();
                    } else if (processedOptions.length >= 2) {
                        getModelResponse(processedOptions[1].toLowerCase());
                    } else {
                        getModelResponse("space");
                    }
                    return true;
                case "edit":
                case "e":
                    if (textHistory.length > 0) {
                        if (processedOptions.length >= 2) {
                            const editTo = processedOptions.slice(1).join(" ");
                            textHistory[textHistory.length - 1].content = editTo;
                            textResults.lastElementChild.innerHTML = marked.parse(editTo);
                        } else {
                            textMessageInput.value = rawInput + " " + textHistory[textHistory.length - 1].content;
                        }
                    } else {
                        alert("No message to edit.");
                    }
                    return true;
                case "regret":
                case "r":
                    let count = mode === "text" ? 2 : 1;
                    if (processedOptions.length >= 2) {
                        const userCount = parseInt(processedOptions[1]);
                        if (userCount && userCount > 0) {
                            count = userCount;
                        } else {
                            alert("Not a valid count. Type '/help regret' to get more info.");
                        }
                    }
                    if (mode === "text") {
                        count = Math.min(count, textHistory.length);
                        textHistory.splice(-count);
                        for (let i = 0; i < count; i++) {
                            textResults.removeChild(textResults.lastElementChild);
                        }
                    } else if (mode === "image") {
                        count = Math.min(count, imageResults.children.length);
                        for (let i = 0; i < count; i++) {
                            imageResults.removeChild(imageResults.firstElementChild);
                        }
                    }
                    return true;
                case "clear":
                case "c":
                    if ((processedOptions.length === 1 && mode === "text") || (processedOptions.length >= 2 && processedOptions[1].toLowerCase() === "text")) {
                        textHistory = [];
                        textResults.innerHTML = "";
                    } else if ((processedOptions.length === 1 && mode === "image") || (processedOptions.length >= 2 && processedOptions[1].toLowerCase() === "images")) {
                        document.getElementById("image-results").innerHTML = "";
                    } else {
                        alert("Not a valid command. Type '/help clear' to get more info.");
                    }
                    return true;
                case "import":
                    if (processedOptions.length >= 2) {
                        const rawImportInput = processedOptions.slice(1).join(" ");
                        try {
                            textHistory = [];
                            textResults.innerHTML = "";
                            const importingTextHistory = JSON.parse(rawImportInput);
                            for (entry of importingTextHistory) {
                                textHistory.push(entry);
                                addLastTextMessage();
                            }
                        } catch (error) {
                            alert("Failed to add chat history. Invalid format: " + error);
                        }
                    } else {
                        alert("No text to import. Type '/help import' to get more info.")
                    }
                    return true;
                case "export":
                    navigator.clipboard.writeText(JSON.stringify(textHistory))
                        .then(() => {
                            alert("Copied chat history to clipboard");
                        })
                        .catch(error => {
                            alert("Failed to copy chat history to clipboard: " + error);
                        });
                    return true;
                case "switch":
                case "s":
                    mode = mode === "text" ? "image" : "text";
                    switchMode();
                    updateActiveQuickSwitchButton();
                    setTimeout(() => {
                        const theInput = mode === "text" ? textMessageInput : imagePromptInput;
                        theInput.focus();
                    }, 1);
                    return true;
                case "about":
                case "credits":
                    alert("simple-ai-wrapper\nby fengzi\na simple ai api (specifically a few cf workers) wrapper using vanilla html/js/css that i initially wrote in like 30 minutes with some ai help\nobviously a small side project\nfor more cool stuff visit https://fengzi.dev");
                    return true;
                case "roadmap":
                    alert("- Visual updates\n- Better server-side error handling and send back message\n- Ability to stop generating (at least stop receiving)\n- Delete or modify any text message or image\n- Add more controls available to these modes\n- Support all types of models Cloudflare supports\n- Add quick selector for all available models\n- Maybe suggestions to prompting\n- Make ai reply as user");
                    return true;
                case "changelog":
                    alert("v2.9:\n- Support for a new output schema and hence more models\n- New quick switcher model and swapped out an old model\n- Hint text now sticks to the top of screen\n\nv2.8:\n- New /import and /export commands\n- The continue command now continues in the same message by default, with new mode options\n- The edit command now fills the last message's content for you to edit if left blank\n- Consistently parse user messages as markdown too\n- Trim image mode prompts too\n- Reduced excessive debug warnings\n- Bump marked version\n\nv2.7.1:\n- Fix text mode auto-scrolling and document height on mobile\n\nv2.7:\n- New default models and second quick switch buttons row for text mode\n- 6x the default max tokens per output and slightly higher temperature preset\n- More polished top and bottom page sections layout for text mode\n\nv2.6:\n- New /edit command\n\nv2.5:\n- New default models for both text and image generation\n\nv2.4:\n- New default model and swapped out an old model\n- More distinguishable colors between normal and italic text\n\nv2.3:\n- New /regenerate command\n- New /continue command\n- New /switch command\n- Command abbreviations and options\n- Fixes and optimizations\n\nv2.2:\n- Commands work in both modes\n- New /regret command\n- Removed model role and user role input\n- Fixes and optimizations\n- More\n\nv2.1:\n- Important bug fixes and UI optimizations\n- Better send and newline keyboard behaviors\n- Shortened the commands\n- Swapped out not-working model in quick switch buttons\n\nv2.0:\n- Text mode\n- Dark mode\n- Ctrl + Enter to send\n- Better image layout\n- Queue display\n- Some commands like these\n- More more jump\n\nv1.0:\n- Made this thingy image mode only");
                    return true;
                case "licenses":
                case "license":
                    alert("simple-ai-wrapper\n\nCopyright 2025 Fengzi\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the \"Software\"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in\nall copies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN\nTHE SOFTWARE.\n\n## Marked\n\nCopyright (c) 2018+, MarkedJS (https://github.com/markedjs/)\nCopyright (c) 2011-2018, Christopher Jeffrey (https://github.com/chjj/)\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the \"Software\"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in\nall copies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN\nTHE SOFTWARE.\n\n## Markdown\n\nCopyright © 2004, John Gruber\nhttp://daringfireball.net/\nAll rights reserved.\n\nRedistribution and use in source and binary forms, with or without modification, are permitted provided that the following conditions are met:\n\n* Redistributions of source code must retain the above copyright notice, this list of conditions and the following disclaimer.\n* Redistributions in binary form must reproduce the above copyright notice, this list of conditions and the following disclaimer in the documentation and/or other materials provided with the distribution.\n* Neither the name “Markdown” nor the names of its contributors may be used to endorse or promote products derived from this software without specific prior written permission.\n\nThis software is provided by the copyright holders and contributors “as is” and any express or implied warranties, including, but not limited to, the implied warranties of merchantability and fitness for a particular purpose are disclaimed. In no event shall the copyright owner or contributors be liable for any direct, indirect, incidental, special, exemplary, or consequential damages (including, but not limited to, procurement of substitute goods or services; loss of use, data, or profits; or business interruption) however caused and on any theory of liability, whether in contract, strict liability, or tort (including negligence or otherwise) arising in any way out of the use of this software, even if advised of the possibility of such damage.");
                    return true;
                case "help":
                case "h":
                    if (processedOptions.length >= 2) {
                        switch (processedOptions[1].toLowerCase()) {
                            case "regenerate":
                                alert("/regenerate (/g)\n\nRegenerate the last response in text mode. You can also use this to let the model start the first message.");
                                break;
                            case "continue":
                                alert("/continue (/t) [mode]\n\nLet the model continue to generate the response in text mode. [mode] can be one of:\n- \"none\" or \"nogap\" to continue directly after the end of the same message\n- \"space\" or \"newspace\" to continue after a space\n- \"line\" or \"newline\" to continue in a new line\n- \"new\", \"msg\", or \"newmsg\" to start a new message.\nBy default this is set to \"space\". You can also use this to let it start the first message.");
                                break;
                            case "edit":
                                alert("/edit (/e) [message]\n\nEdit the last message's content to [message] in the chat history. (This can be either a model or user message.) If [message] is left blank, autofill input to the last message's content to edit.");
                                break;
                            case "regret":
                                alert("/regret (/r) [count]\n\nRemove the last [count] results in the current mode. (In text mode, this includes both model and user messages.) [count] must be a positive integer. Default is 2 in text mode and 1 in image mode.");
                                break;
                            case "clear":
                                alert("/clear (/c) [mode]\n\nClear all results in the specified [mode] (\"text\" or \"images\"). Default is the current mode.");
                                break;
                            case "import":
                                alert("/import <history>\n\nClear the current chat and import text history from the JSON <history> gotten from /export.");
                                break;
                            case "export":
                                alert("/export\n\nCopy text history as JSON to the clipboard to be imported with /import later.");
                                break;
                            case "switch":
                                alert("/switch (/s)\n\nSwitch between text and image modes.");
                                break;
                            case "about":
                                alert("/about\n\nShow info about this project.");
                                break;
                            case "roadmap":
                                alert("/roadmap\n\nShow the list of planned features that may get added in the future.");
                                break;
                            case "changelog":
                                alert("/changelog\n\nShow the list of changes over each version.");
                                break;
                            case "licenses":
                                alert("/licenses\n\nShow the license of this project and the licenses of open-source libraries used in this project.");
                                break;
                            case "help":
                                alert("/help [command]\n\nShow the usage of the specified [command]. If [command] not set, show the list of all available commands.");
                                break;
                            default:
                                alert("Not a valid command. Type '/help' to see a list of all available commands.");
                        }
                    } else {
                        alert("Commands:\n- /regenerate (/g)\n- /continue (/t) [mode]\n- /edit (/e) [message]\n- /regret (/r) [count]\n- /clear (/c) [\"text\"/\"images\"]\n- /import <history>\n- /export\n- /switch (/s)\n- /about\n- /roadmap\n- /changelog\n- /licenses\n- /help (/h) [command]");
                    }
                    return true;
                case "egg":
                    alert("egg");
                    return true;
                default:
                    return false;
            }
        }

        // get text mode model response and add it somewhere depending on the mode
        function getModelResponse(mode = "new") {
            // get the values
            const model = document.getElementById("model-selector").value;
            const systemPrompt = document.getElementById("system-prompt-input").value;

            // prepare data to send to the llm
            const fullPrompt = [{ role: "system", content: systemPrompt }];
            textHistory.forEach(item => {
                if (item.user) fullPrompt.push({ role: "user", content: item.content });
                else fullPrompt.push({ role: "assistant", content: item.content });
            });

            const requestBody = {
                model,
                options: {
                    messages: fullPrompt,
                    stream: true,
                    max_tokens: 1536,
                    temperature: 0.25
                }
            };

            // send request
            textQueue++;
            updateHints();

            fetch("https://ai-endpoint.fengzi.workers.dev/", {
                method: "POST",
                body: JSON.stringify(requestBody)
            })
            .then(async response => {
                // select or add new responding model msg
                let currentHistoryItemZ;
                let respondingElement;
                let respondingText;
                if (mode === "new" || mode === "msg" || mode === "newmsg") {
                    textHistory.push({ user: false, content: "" });
                    currentHistoryItem = textHistory[textHistory.length - 1];
                    respondingElement = addLastTextMessage();
                    respondingText = "";
                } else {
                    currentHistoryItem = textHistory[textHistory.length - 1];
                    respondingElement = textResults.lastElementChild;
                    respondingText = currentHistoryItem.content;
                    if (mode === "none" || mode === "nogap") {
                        // (as is)
                    } else if (mode === "line" || mode === "newline") {
                        respondingText += "\n\n";
                    } else { // "space", "newspace", and fallback
                        respondingText += " ";
                    }
                }

                // sse decode magic took me a whole day to figure out
                // the below logic is running in beta, i will leave debug code inside to detect unexpected patterns and behaviors from data
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let readerDone = false, dataDone = false; // double safeguard
                while (!readerDone && !dataDone) {
                    let { value, done } = await reader.read();
                    readerDone = done;
                    const chunk = decoder.decode(value, { stream: true }); // read sse chunks
                    const payloads = chunk.split("data: "); // split into data payloads
                    payloads.shift(); // empty first item due to split
                    payloads.forEach(payload => { // do things with them payloads
                        if (payload.startsWith("{\"response\":\"") || payload.startsWith("{\"id\":\"")) { // sneaky little tomfoolery trolling thingamabob
                            // likely data payload (man i hate this sse method they just send text)
                            if (!(payload.trim().endsWith("\}"))) console.warn("WARNING: payload starts with familiar json response but did not close\n", payload); // DEBUG
                            try {
                                const data = JSON.parse(payload); // unbox the holy gift from this black box api
                                if (Object.hasOwn(data, "response")) {
                                    respondingText += data.response; // add data
                                } else if (Object.hasOwn(data, "choices")) { // fking separate schema for certain new models
                                    actualContent = data.choices[0]?.delta?.content;
                                    if (actualContent !== undefined) respondingText += actualContent;
                                } else {
                                    console.warn("WARNING: payload first determined to be data but doesn't contain a known schema for response\n", payload); // DEBUG
                                }
                                respondingElement.innerHTML = marked.parse(respondingText); // EXPERIMENTAL: replace ui with parsed markdown
                                if ((topPageSection.clientHeight + topPageSection.scrollTop + 36) >= topPageSection.scrollHeight) topPageSection.scrollTo(0, topPageSection.scrollHeight); // scroll to bottom if close to bottom
                            } catch (error) {
                                console.error("ERROR: failed trying to use a payload with a familiar json response\n", payload, error); // DEBUG
                            }
                        } else if (payload.startsWith("[DONE]")) {
                            // very likely done payload
                            currentHistoryItem.content = respondingText;
                            textQueue--;
                            updateHints();
                            dataDone = true;
                            console.log("DEBUG: data done return: \n reader done", readerDone, "data done", dataDone); // DEBUG
                            return;
                        } else {
                            console.warn("WARNING: unknown payload type\n", payload); // DEBUG
                        }
                    });
                    if (readerDone) console.warn("WARNING: using readerDone (payloads foreach function didn't return out the entire loop, which is maybe expected behavior). is concerning if there isn't data done notice on top ^"); // DEBUG
                    if (readerDone && !dataDone) console.warn("WARNING: confirmed reader done without data done"); // DEBUG
                }
            })
            .catch(error => {
                console.error("ERROR: entire response handling logic throws an unhandled exception\n", error, "\nrequest body used:\n", JSON.stringify(requestBody)); // DEBUG
                document.getElementById("text-hint").innerHTML = error.message;
                textQueue--;
            });
        }

        // keyboard event listener: slash key focus, button hints to command input, and enter keyboard behavior: shift + enter default (normally newline), ctrl + enter to send, enter is auto
        document.addEventListener("keydown", event => {
            let theInput, theButton;
            if (event.key === "/") textMessageInput.focus();
            if (document.activeElement === textMessageInput) {
                theInput = textMessageInput;
                theButton = textSendButton;
                setTimeout(() => {
                    if (textMessageInput.value.trim().startsWith("/")) {
                        textSendButton.innerHTML = "Magic?";
                    } else {
                        textSendButton.innerHTML = "Send";
                    }
                }, 1);
            } else if (document.activeElement === imagePromptInput) {
                theInput = imagePromptInput;
                theButton = imageGenerateButton;
                setTimeout(() => {
                    if (imagePromptInput.value.trim().startsWith("/")) {
                        imageGenerateButton.innerHTML = "Magic?";
                    } else {
                        imageGenerateButton.innerHTML = "Generate";
                    }
                }, 1);
            } else {
                return;
            }

            // to send:
            if (event.key === "Enter" && // enter is pressed
                !(event.shiftKey) && // shift must not be pressed
                (event.ctrlKey || // either ctrl is pressed
                (theInput.value.trim() !== "" && !(theInput.value.includes("\n")))) // or nothing needs to be pressed but message must not be empty and there isn't already a newline, in which cases Enter enters newline mode
            ) {
                event.preventDefault();
                theButton.click();
            }
        });

        // new text request
        textSendButton.addEventListener("click", () => {
            // get the message and clear input
            const message = textMessageInput.value.trim();
            textMessageInput.value = "";

            // special commands
            if (message.startsWith("/")) {
                if (handleCommands(message)) {
                    return;
                } else {
                    setTimeout(() => {
                        textSendButton.innerHTML = "Not magic";
                    }, 1);
                }
            }

            // add new user msg to history
            textHistory.push({ user: true, content: message });
            addLastTextMessage();

            // focus back on input
            textMessageInput.focus();

            // generate model response
            getModelResponse();
        });

        // new image request
        imageGenerateButton.addEventListener("click", () => {
            // get the values
            const model = document.getElementById("model-selector").value;
            const prompt = imagePromptInput.value.trim();

            // special commands
            if (prompt.startsWith("/")) {
                if (handleCommands(prompt)) {
                    imagePromptInput.value = "";
                    return;
                } else {
                    setTimeout(() => {
                        imageGenerateButton.innerHTML = "Not magic";
                    }, 1);
                }
            }

            // prepare data to send to the model
            const requestBody = {
                model,
                options: {
                    prompt
                }
            };

            // send request
            imageQueue++;
            updateHints();

            fetch("https://ai-endpoint.fengzi.workers.dev/", {
                method: "POST",
                body: JSON.stringify(requestBody)
            })
            .then(response => response.blob())
            .then(blob => {
                const imageURL = URL.createObjectURL(blob);
                const imageElement = document.createElement("img");
                imageElement.src = imageURL;
                imageElement.title = prompt;
                imageElement.alt = "Generated image: " + prompt;
                imageResults.insertBefore(imageElement, imageResults.firstChild);

                imageQueue--;
                updateHints();
            })
            .catch(error => {
                console.error("ERROR: entire response handling logic throws an unhandled exception\n", error, "\nrequest body used:\n", JSON.stringify(requestBody));
                document.getElementById("image-hint").innerHTML = error.message;
                imageQueue--;
            });
        });
    </script>
</body>
